{% extends "admin/base_site.html" %}
{% block content %}
<style>
    .soon-wrap { text-align: center; margin-top: 80px; }
    .soon-icon { font-size: 60px; display: block; margin-bottom: 16px; }
    .soon-title { font-size: 24px; font-weight: bold; }
    .soon-sub { font-size: 15px; color: #666; margin-top: 10px; }
    .soon-btn { display: inline-block; margin-top: 24px; }
</style>

<div class="soon-wrap">
    <span class="soon-icon">🚧</span>
    <div class="soon-title">{{ section_name }}</div>
    <div class="soon-sub">This section is under construction and will be available soon.</div>
    <a class="button soon-btn" href="{% url 'admin:index' %}">← Back to Admin</a>
    {% include "warehousing/includes/lang_toggle.html" %}
</div>
{% endblock %}
