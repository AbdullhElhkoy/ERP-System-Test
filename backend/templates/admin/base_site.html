{% extends "admin/base_site.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<style>
  #lang-toggle-wrap {
    position: fixed; top: 8px; right: 16px; z-index: 10000;
  }
  #lang-toggle-wrap a {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; font-size: 13px; font-weight: 600;
    border: 1px solid #cbd5e1; border-radius: 6px;
    background: #fff; text-decoration: none; color: #333;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: background .15s;
  }
  #lang-toggle-wrap a:hover { background: #f0f4f8; }
</style>
{% endblock %}

{% block nav-global %}
  {{ block.super }}
  <div id="lang-toggle-wrap">
    <a href="{% url 'language_settings' %}?next={{ request.path }}">
      🌐 {% trans "Language" %}
    </a>
  </div>
{% endblock %}
