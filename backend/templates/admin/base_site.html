{% extends "admin/base_site.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<style>
  #lang-toggle-wrap {
    position: fixed; top: 8px; right: 16px; z-index: 10000;
  }
  #lang-toggle-wrap select {
    padding: 4px 8px; font-size: 13px; font-weight: 600;
    border: 1px solid #cbd5e1; border-radius: 6px;
    background: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
</style>
{% endblock %}

{% block nav-global %}
  {{ block.super }}
  <div id="lang-toggle-wrap" style="position:fixed;top:8px;right:16px;z-index:10000;">
    <form id="lang-form" method="post" action="{% url 'set_language' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <select name="language" onchange="this.form.submit()">
        {% get_current_language as CURRENT_LANG %}
        {% get_available_languages as LANGUAGES %}
        {% for lang_code, lang_name in LANGUAGES %}
          <option value="{{ lang_code }}"{% if lang_code == CURRENT_LANG %} selected{% endif %}>
            {{ lang_name }}
          </option>
        {% endfor %}
      </select>
    </form>
  </div>
{% endblock %}
